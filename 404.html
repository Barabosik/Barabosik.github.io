<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · Nikita Andreiev</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#161c1a">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/BigShoulders.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: 'Big Shoulders'; font-weight: 700 800; font-display: swap; src: url(/fonts/BigShoulders.woff2) format('woff2'); }
    @font-face { font-family: 'Geist Mono'; font-weight: 100 900; font-display: swap; src: url(/fonts/GeistMono.woff2) format('woff2'); }
    @font-face { font-family: 'Public Sans'; font-weight: 400 700; font-display: swap; src: url(/fonts/PublicSans.woff2) format('woff2'); }
    :root { --bg: #161c1a; --fg: #e3e2da; --muted: #959b94; --accent: #9fc7b8; --light: #35413d; --dark: #1d2523; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh; display: grid; place-items: center; padding: 32px 20px;
      background: var(--bg); color: var(--fg); font: 400 1.125rem/1.5 'Public Sans', system-ui, sans-serif;
    }
    main { width: min(100%, 720px); display: grid; gap: 28px; justify-items: start; }
    .mono { font: 500 0.875rem/1 'Geist Mono', ui-monospace, monospace; color: var(--accent); letter-spacing: 0.04em; }
    h1 { margin: 0; font: 800 clamp(5.5rem, 3rem + 14vw, 12rem)/0.82 'Big Shoulders', 'Arial Narrow', sans-serif; text-transform: uppercase; }
    p { margin: 0; max-width: 34ch; color: var(--muted); font-size: clamp(1.125rem, 1rem + 0.5vw, 1.375rem); }
    p strong { color: var(--fg); font-weight: 500; }
    a {
      display: inline-block; padding: 14px 22px; background: var(--accent); color: var(--bg);
      font-weight: 600; text-decoration: none; transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    a:hover { transform: translateY(-2px); }
    a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
    /* a strip of the board: the square you asked for is the lit one, and it is empty */
    .rank { display: grid; grid-template-columns: repeat(8, 1fr); width: min(100%, 420px); aspect-ratio: 8 / 1; }
    .rank i { background: var(--dark); }
    .rank i:nth-child(odd) { background: var(--light); }
    .rank i.here { background: var(--accent); opacity: 0.9; }
    @media (prefers-reduced-motion: no-preference) {
      .rank i.here { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.4; } }
    }
  </style>
</head>
<body>
  <main>
    <span class="mono">404 · no such square</span>
    <h1>Illegal<br>move</h1>
    <div class="rank" aria-hidden="true"><i></i><i></i><i></i><i></i><i class="here"></i><i></i><i></i><i></i></div>
    <p>There is nothing on this square. The page may have moved, or the link has a typo. <strong>The game is still on the board.</strong></p>
    <a href="/">Back to the board</a>
  </main>
</body>
</html>
